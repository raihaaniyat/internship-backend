services:
  postgres:
    image: postgres:16-alpine
    container_name: internship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-internship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internship_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-internship}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-internship} -d ${POSTGRES_DB:-internship}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: internship_postgres_data
